# Caller for baseline's reusable R package release. Copy to .github/workflows/.
# Needs repo secret RELEASE_PAT: fine-grained PAT, Contents read/write on this
# repo, owned by someone allowed to push to protected main.
# The calling job grants contents: write so the callee's publish job can use it.
# No concurrency here: the callee owns the "release" group (same name here would deadlock).
name: Release

on:
  # Opt in to a patch release on every merge to main: uncomment push below.
  # Requires a branch rule on main that requires a pull request before
  # merging, so every push to main is a PR merge. Anyone on the rule's bypass
  # list who pushes directly also cuts a release. CI-only changes don't ship in the package, and the release commit carries
  # [skip ci], so neither re-triggers. The callee's "release" concurrency group
  # runs releases one at a time; if main moves mid-release, that push is
  # rejected and the run for the newer merge releases both changes.
  # push:
  #   branches: [main]
  #   paths-ignore: ['.github/**']
  workflow_dispatch:
    inputs:
      version-type:
        description: Version component to bump
        type: choice
        options: [patch, minor, major, dev]
        default: patch
      dry-run:
        description: Build and check only; do not push or publish
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/release-r-package.yaml@0a6e332d70f7a15520c62870221b35ef040ef933 # v2.0.0
    with:
      # Push events have no inputs. An empty version-type would override the
      # callee's patch default and fail its validation, so fall back here.
      version-type: ${{ inputs.version-type || 'patch' }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
      # The vignettes are Quarto documents.
      quarto: true
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
