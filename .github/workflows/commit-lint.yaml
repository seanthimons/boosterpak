# Caller: lint commit subjects, PR title, and branch name on every pull request.
# Copy to .github/workflows/commit-lint.yaml. Permissions: contents: read. Secrets: none.
name: Commit Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: commit-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit Lint
    uses: seanthimons/baseline/.github/workflows/commit-lint.yaml@b2e51040fb602e74d24570ea3565065ac7ab7263 # v1.5.0
