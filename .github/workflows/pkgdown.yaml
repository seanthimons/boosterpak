# Copy to .github/workflows/pkgdown.yaml. Builds the pkgdown site on every push/PR
# and deploys to GitHub Pages on non-PR events via the baseline reusable workflow.
# One-time setup: Settings > Pages > Build and deployment > Source must be "GitHub Actions".
name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
  cancel-in-progress: true

jobs:
  pkgdown:
    name: pkgdown
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: seanthimons/baseline/.github/workflows/pkgdown.yaml@0a6e332d70f7a15520c62870221b35ef040ef933 # v2.0.0
    with:
      # The vignettes are Quarto documents.
      quarto: true
