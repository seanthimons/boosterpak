name: R-CMD-check

on:
  push:
    branches: [main]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r-cmd-check:
    name: R CMD check
    # Pinned to the baseline v2.2.0 commit. Dependabot bumps this.
    uses: seanthimons/baseline/.github/workflows/r-cmd-check.yaml@067b932909c9ca4cdce189717c99a62a812d3db9 # v2.2.1
    with:
      # The vignettes are Quarto documents.
      quarto: true
