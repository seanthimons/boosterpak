name: R-CMD-check

on:
  push:
    branches: [main]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r-cmd-check:
    name: R CMD check
    # Pinned to the baseline v2.0.0 commit. Dependabot bumps this.
    uses: seanthimons/baseline/.github/workflows/r-cmd-check.yaml@0a6e332d70f7a15520c62870221b35ef040ef933 # v2.0.0
    with:
      # The vignettes are Quarto documents.
      quarto: true
